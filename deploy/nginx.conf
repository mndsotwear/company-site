# Nginx جلوی سایت: SSL (با Certbot)، فشرده‌سازی، کش فایل‌های ثابت
# مسیر روی سرور: /etc/nginx/sites-available/shahinmarine.com
server {
  listen 80;
  server_name shahinmarine.com www.shahinmarine.com;
  return 301 https://shahinmarine.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.shahinmarine.com;
  ssl_certificate /etc/letsencrypt/live/shahinmarine.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shahinmarine.com/privkey.pem;
  return 301 https://shahinmarine.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name shahinmarine.com;
  ssl_certificate /etc/letsencrypt/live/shahinmarine.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shahinmarine.com/privkey.pem;

  client_max_body_size 50m; # آپلود ویدیو و اکسل در پنل
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
